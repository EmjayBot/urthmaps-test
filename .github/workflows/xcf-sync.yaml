# Test bed: automatic XCF layer sync for urth-atlas.
#
# Any push that touches `maps/source/urth.xcf` exports the mapped layers
# with headless GIMP 3 and commits the PNGs back into this repo.
# urth-atlas pulls `atlas/*.png` from here (see its `map-imagery.yml`).
#
# | XCF layer              | atlas file              | atlas use              |
# |------------------------|-------------------------|------------------------|
# | Labels/Cities          | atlas/cities.png        | city markers           |
# | Labels/Sub-National    | atlas/subnational.png   | subnational markers    |
# | Political              | atlas/blank-political.png | base political map   |
# | Labels/National        | atlas/national.png      | NEW (wired, undisplayed) |
# | Ocean                  | atlas/ocean.png         | NEW (wired, undisplayed) |
#
# Local test: pip install "git+https://github.com/EmjayBot/xcf-git-sync.git"
#   xcf-git-sync --config xcf-sync.yaml --once
#   xcf-git-sync --xcf maps/source/urth.xcf --repo . --list-layers \
#     --include "National,Cities,Sub-National,Political,Ocean"

name: xcf-sync
on:
  push:
    branches: [main]
    paths:
      - "maps/source/urth.xcf"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: xcf-sync-${{ github.ref }}
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install GIMP 3 (Flatpak, official builds)
        # NOTE: the Flatpak ships no gimp-console binary, so we drive the
        # GUI binary headless with --no-interface (xcf-git-sync picks that
        # flag automatically for non-2.10 builds).
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q flatpak
          sudo flatpak remote-add --if-not-exists flathub \
            https://flathub.org/repo/flathub.flatpakrepo
          sudo flatpak install -y flathub org.gimp.GIMP
          if flatpak run org.gimp.GIMP --no-interface --version >/dev/null 2>&1; then
            echo "GIMP_BIN=flatpak run org.gimp.GIMP" >> "$GITHUB_ENV"
          else
            echo "headless flatpak GIMP failed; trying xvfb"
            sudo apt-get install -y -q xvfb
            echo "GIMP_BIN=xvfb-run -a flatpak run org.gimp.GIMP" >> "$GITHUB_ENV"
          fi
          echo "Using: $GIMP_BIN"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install xcf-git-sync
        run: pip install "git+https://github.com/EmjayBot/xcf-git-sync.git"

      - name: Export layers
        run: >
          xcf-git-sync
          --xcf maps/source/urth.xcf --repo . --out assets/xcf_layers --once
          --include "National,Cities,Sub-National,Political,Ocean"
          --gimp-bin "$GIMP_BIN"
          --timeout 600

      - name: Map to atlas filenames
        run: |
          mkdir -p atlas
          cp assets/xcf_layers/urth/Labels/Cities.png        atlas/cities.png
          cp assets/xcf_layers/urth/Labels/Sub-National.png  atlas/subnational.png
          cp assets/xcf_layers/urth/Political.png            atlas/blank-political.png
          cp assets/xcf_layers/urth/Labels/National.png      atlas/national.png
          cp assets/xcf_layers/urth/Ocean.png                atlas/ocean.png
          ls -la atlas

      - name: Commit PNGs back
        run: |
          git config user.name "xcf-sync-bot"
          git config user.email "xcf-sync-bot@users.noreply.github.com"
          git add atlas assets/xcf_layers
          git diff --cached --quiet && echo "No layer changes." || {
            git commit -m "auto: sync layers from maps/source/urth.xcf"
            git push
          }
